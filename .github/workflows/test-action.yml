name: 🧪 Test Custom Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🚀 Build, Test & Local Invocations
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: pnpm run lint

      - name: 🧪 Run unit tests
        run: pnpm test

      - name: 🔍 Strict TypeScript type-check
        run: pnpm run type-check

      - name: 🔨 Build Custom Action
        run: pnpm run build

      - name: 🛡️ Verify dist/ is synchronized
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::The dist/index.js bundle is out of sync with source files. Run 'pnpm run build' and commit changes."
            git diff dist/
            exit 1
          fi

      - name: 🚀 Test local Custom Action invocation
        id: test-action
        uses: ./
        with:
          username: 'Gustavo'
          role: 'Lead Cloud Architect'

      - name: 📋 Validate received outputs
        run: |
          echo "=== OUTPUT VALIDATION ==="
          echo "Received result: ${{ steps.test-action.outputs.result }}"
          echo "Received timestamp: ${{ steps.test-action.outputs.timestamp }}"

          if [ -z "${{ steps.test-action.outputs.result }}" ]; then
            echo "::error::Output 'result' is empty."
            exit 1
          fi

          if [ -z "${{ steps.test-action.outputs.timestamp }}" ]; then
            echo "::error::Output 'timestamp' is empty."
            exit 1
          fi
