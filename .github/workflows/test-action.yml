name: 🧪 Test Custom Action

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: 🚀 Build, Test & Local Invocations
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: ⚙️ Setup pnpm
              uses: pnpm/action-setup@v6

            - name: ⚙️ Setup Node.js (v22.23.5 LTS)
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.node-version'
                  cache: 'pnpm'

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 📝 Validate commit messages (PR)
              if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
              run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

            - name: 📝 Validate commit messages (Push)
              if: github.event_name == 'push' && !github.event.forced && github.event.before != '0000000000000000000000000000000000000000'
              run: pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

            - name: ✨ Check formatting (Prettier)
              run: pnpm run format:check

            - name: 🔍 Run ESLint
              run: pnpm run lint

            - name: 🔍 Strict TypeScript type-check
              run: pnpm run type-check

            - name: 🧪 Run unit tests & coverage
              run: pnpm run test:coverage

            - name: 🔨 Build Custom Action
              run: pnpm run build

            - name: 🛡️ Verify dist/ is synchronized
              run: |
                  if [ -n "$(git status --porcelain dist/)" ]; then
                    echo "::error::The dist/index.js bundle is out of sync with source files. Run 'pnpm run build' and commit changes."
                    git diff dist/
                    exit 1
                  fi

            - name: 🚀 Test local Custom Action invocation
              id: test-action
              uses: ./
              with:
                  username: 'Gustavo'
                  role: 'Lead Cloud Architect'

            - name: 📋 Validate received outputs
              env:
                  ACTION_RESULT: ${{ steps.test-action.outputs.result }}
                  ACTION_RESULTADO: ${{ steps.test-action.outputs.resultado }}
                  ACTION_TIMESTAMP: ${{ steps.test-action.outputs.timestamp }}
              run: |
                  echo "=== OUTPUT VALIDATION ==="
                  echo "Received result: ${ACTION_RESULT}"
                  echo "Received resultado: ${ACTION_RESULTADO}"
                  echo "Received timestamp: ${ACTION_TIMESTAMP}"

                  if [ -z "${ACTION_RESULT}" ] || [ -z "${ACTION_RESULTADO}" ] || [ -z "${ACTION_TIMESTAMP}" ]; then
                    echo "::error::One or more required action outputs are empty."
                    exit 1
                  fi

                  if [[ "${ACTION_RESULT}" != *"Gustavo (Lead Cloud Architect)"* ]]; then
                    echo "::error::Unexpected 'result' format: ${ACTION_RESULT}"
                    exit 1
                  fi
