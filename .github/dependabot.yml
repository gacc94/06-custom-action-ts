version: 2
updates:
    # Automated dependency monitoring for pnpm packages
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 10
      commit-message:
          prefix: 'build'
          include: 'scope'
      ignore:
          # typescript-eslint 8.x does not support TypeScript 7.0+ yet
          - dependency-name: 'typescript'
            versions: ['>= 7.0.0']
      groups:
          dev-dependencies:
              patterns:
                  - '*'
              dependency-type: 'development'

    # Automated updates for GitHub Actions workflows
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'build'
          include: 'scope'
